name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vision_assist_test
          POSTGRES_USER: vision_assist
          POSTGRES_PASSWORD: vision_assist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vision_assist -d vision_assist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -w server
        env:
          TEST_DATABASE_URL: postgres://vision_assist:vision_assist@localhost:5432/vision_assist_test
      - run: npm test -w mobile -- --browsers=ChromeHeadless
